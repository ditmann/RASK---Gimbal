
name: Rust Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Client and Server Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Run all tests
        run: cargo test --no-default-features
