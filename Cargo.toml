[package]
name = "rask-gimbal"
version = "0.1.0"
edition = "2024"

[dependencies]

openvr = {version = "0.9", optional = true}

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22.1"

[features]
vr = ["dep:openvr"]

#for skole pc er denne delen viktig:
# CMake bygger ellers openvr_sys med debug-CRT (MSVCRTD), som ikke kan
# lenkes med Rust (MSVCRT). opt-level > 0 gir RelWithDebInfo i CMake.
[profile.dev.package.openvr_sys]
opt-level = 1


[[bin]]
name = "client"
path = "Client/ClientAPI.rs"
required-features = ["vr"]

[[bin]]
name = "server"
path = "Server/main.rs"
